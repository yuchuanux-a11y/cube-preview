<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/cube-preview/cube.svg" type="image/svg+xml" />
    <title>Cube UI Component Examples</title>
    <script>
      (function () {
        var key = 'cube-example-theme';
        var stored = localStorage.getItem(key);
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.classList.add(theme);
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <script type="module" crossorigin src="/cube-preview/assets/index-BHZ_FCBi.js"></script>
    <link rel="stylesheet" crossorigin href="/cube-preview/assets/index-676pbImP.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
